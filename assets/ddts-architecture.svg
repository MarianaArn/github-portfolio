<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">DDTS architecture</title><desc id="desc">Users connect through Nginx to a systemd-managed Flask application with presentation, application, and persistence layers.</desc>
