<defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5f6672"/></marker></defs>
<rect width="900" height="560" rx="28" fill="#f7f8fb"/>
<text x="450" y="48" text-anchor="middle" class="t">DDTS Production Architecture</text>
<rect x="55" y="90" width="190" height="90" rx="16" class="b"/><text x="150" y="125" text-anchor="middle" class="t">Users</text><text x="150" y="151" text-anchor="middle" class="s">Technicians • Managers</text>
